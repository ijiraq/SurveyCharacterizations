# N26 HST heliostack (Napier et al. 2026, PSJ 7, 117): reanalysis of the
# Bernstein et al. 2004 GO-9433 ACS/WFC F606W field.
#
#   survey_debias --survey characterization/N26/N26.toml \
#       --root . --model Models/OSSOS
#
# Orbits are only upper limits, so this survey uses model_ae
#
# Paths are relative to --root (the repository root). Everything for this
# survey lives in characterization/N26/:
#   N26.toml        this file
#   N26.csv         detections (Napier Tables 1 and 2), m_stmag in F606W STMAG
#   pointings.list  one 6-tile mosaic line at the 15-day stack midpoint
#   N26.eff         F606W STMAG efficiency, filter= t
#   HST.csv         JPL Horizons observer vectors (request in HST.jpl_batch)
# Colours come from the shared colour.toml at the root ("t-g" = -0.4:
# t = STMAG_F606W = r_AB + 0.3).

[survey]
name = "N26 heliostack"
model_band = "r"
colour_file = "colour.toml"
surveys = ["N26"]
paper_reference_jd = 2452672.8585
rate_cut_min_arcsec_hr = 0.05
rate_cut_max_arcsec_hr = 6.4
detections_relpath = "characterization/N26/N26.csv"
detections_full_name = "characterization/N26/N26.detections-full"
results_name = "characterization/N26/N26.bias.csv"
check_detected_title = "detected flag≥4 (single 15-day stack)"
bias_method = "model_ae"

# Program name = column in the detections table. These are the columns read.
# aq_grid requires mag, a, d_bary, e or q, and i or ifree. ifree is Napier's
# Huang et al. (2022) value; a blank cell falls back to ifree from i and a.
[detection_columns]
mag = "m_stmag"
name = "name"
a = "a"
e = "e"
i = "i"
ifree = "ifree"
d_bary = "d_bary"
comp = "comp"

# The catalogue has no survey or block column: every row is N26/N26.
[detection_defaults]
survey = "N26"
block = "N26"
